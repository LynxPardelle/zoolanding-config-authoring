# QA evidence only. This workflow never promotes or deploys a release.
name: Validate THN candidate (no deploy)

on:
  push:
    branches: ['codex/thn-task029-config-authoring']

permissions:
  contents: read

concurrency:
  group: thn-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_DEFAULT_REGION: us-east-1
      SAM_CLI_TELEMETRY: '0'
      LOG_LEVEL: ERROR
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan full history with the pinned secret scanner
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --log-opts="--all --full-history" --redact=100 --no-banner --ignore-gitleaks-allow .
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310
        with:
          version: 1.163.0
          use-installer: true
      - name: Test and build without cloud credentials
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check boto3==1.43.84
          python -m pip check
          python -m unittest discover -s tests -p 'test_*.py'
          python tools/build_lambda_artifact.py
          sam validate --lint
          sam build --no-cached
          python tools/build_lambda_artifact.py --verify-artifact .aws-sam/build/ConfigAuthoringFunction
          mkdir -p logs/thn-ci
          tar -cf logs/thn-ci/candidate.tar -C .aws-sam build
          python -m pip list --format=json > logs/thn-ci/dependencies.json
      - name: Record exact source, run and candidate digest
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          archive = Path('logs/thn-ci/candidate.tar')
          record = {
              'schemaVersion': 1, 'purpose': 'validation-only', 'deployable': False,
              'repository': os.environ['GITHUB_REPOSITORY'],
              'sourceCommit': os.environ['GITHUB_SHA'],
              'sourceRef': os.environ['GITHUB_REF'],
              'runId': os.environ['GITHUB_RUN_ID'],
              'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'packageFile': archive.name,
              'packageSha256': hashlib.sha256(archive.read_bytes()).hexdigest(),
              'packageBytes': archive.stat().st_size,
          }
          Path('logs/thn-ci/source.json').write_text(json.dumps(record, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: thn-candidate-config-authoring-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            logs/thn-ci/candidate.tar
            logs/thn-ci/source.json
            logs/thn-ci/dependencies.json
          retention-days: 30
          if-no-files-found: error
