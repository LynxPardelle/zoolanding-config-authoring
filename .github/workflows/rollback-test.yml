name: Rollback Test

on:
  # Discovery only; both provenance modes remain manual-only.
  push:
    branches: [codex/thn-task029-config-authoring]
  workflow_dispatch:
    inputs:
      recovery_mode:
        description: Select one provenance contract; never fall back automatically
        required: true
        type: choice
        default: GitHub-release
        options:
          - GitHub-release
          - AWS-live-snapshot/v1
      source_run_id:
        description: Successful Deploy Test run ID
        required: false
        type: string
      source_artifact_id:
        description: Immutable artifact ID recorded by that run
        required: false
        type: string
      source_sha:
        description: Full 40-character source commit SHA
        required: false
        type: string
      source_manifest_sha256:
        description: Recorded SHA-256 of the artifact manifest
        required: false
        type: string
      expected_tooling_sha:
        description: Reviewed current TEST tooling commit, independent of prior payload source
        required: true
        type: string
      expected_workflow_sha256:
        description: Reviewed SHA-256 of this LF-normalized workflow
        required: true
        type: string
      expected_snapshot_sha256:
        description: Approved private AWS snapshot digest, only for AWS mode
        required: false
        type: string
      expected_plan_sha256:
        description: Approved fresh recovery plan digest, only for AWS mode
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: zoolanding-config-authoring-test
  cancel-in-progress: false

jobs:
  register:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - run: echo 'TEST manual workflow registered. No checkout, environment, artifact or AWS credentials.'

  verify-source:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Validate rollback coordinates and TEST ref
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_ARTIFACT_ID: ${{ inputs.source_artifact_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          manifest_digest: ${{ inputs.source_manifest_sha256 }}
          RECOVERY_MODE: ${{ inputs.recovery_mode }}
          TOOLING_SHA: ${{ inputs.expected_tooling_sha }}
          WORKFLOW_SHA256: ${{ inputs.expected_workflow_sha256 }}
          SNAPSHOT_SHA256: ${{ inputs.expected_snapshot_sha256 }}
          PLAN_SHA256: ${{ inputs.expected_plan_sha256 }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/test"
          [[ "$TOOLING_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "tooling_sha_invalid"; exit 1; }
          test "$GITHUB_SHA" = "$TOOLING_SHA"
          [[ "$WORKFLOW_SHA256" =~ ^[a-f0-9]{64}$ ]] || { echo "workflow_digest_invalid"; exit 1; }
          if [[ "$RECOVERY_MODE" == "AWS-live-snapshot/v1" ]]; then
            test -z "$SOURCE_RUN_ID$SOURCE_ARTIFACT_ID$SOURCE_SHA$manifest_digest"
            [[ "$SNAPSHOT_SHA256" =~ ^[a-f0-9]{64}$ ]] || { echo "snapshot_sha256_invalid"; exit 1; }
            [[ "$PLAN_SHA256" =~ ^[a-f0-9]{64}$ ]] || { echo "plan_sha256_invalid"; exit 1; }
            exit 0
          fi
          test "$RECOVERY_MODE" = "GitHub-release"
          test -z "$SNAPSHOT_SHA256$PLAN_SHA256"
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo "source_run_id_invalid"; exit 1; }
          [[ "$SOURCE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || { echo "source_artifact_id_invalid"; exit 1; }
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "source_sha_invalid"; exit 1; }
          [[ "$manifest_digest" =~ ^[a-f0-9]{64}$ ]] || { echo "manifest_digest_invalid"; exit 1; }
      - name: Verify source Deploy Test run
        if: inputs.recovery_mode == 'GitHub-release'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_ARTIFACT_ID: ${{ inputs.source_artifact_id }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fail = code => { throw new Error(code); };
            if (process.env.GITHUB_REF !== 'refs/heads/test') fail('rollback_ref_invalid');
            const runId = Number(process.env.SOURCE_RUN_ID);
            if (!Number.isSafeInteger(runId) || runId <= 0) fail('source_run_id_invalid');
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });
            if (
              run.path !== '.github/workflows/deploy-test.yml'
              || run.event !== 'push'
              || run.head_branch !== 'test'
              || run.head_sha !== process.env.SOURCE_SHA
              || run.status !== 'completed'
              || run.conclusion !== 'success'
            ) {
              fail('source_deploy_run_invalid');
            }
            const artifactId = Number(process.env.SOURCE_ARTIFACT_ID);
            if (!Number.isSafeInteger(artifactId) || artifactId <= 0) fail('source_artifact_id_invalid');
            const { data: artifact } = await github.rest.actions.getArtifact({
              owner: context.repo.owner, repo: context.repo.repo, artifact_id: artifactId,
            });
            if (artifact.expired !== false || artifact.workflow_run?.id !== runId
              || artifact.workflow_run?.head_sha !== process.env.SOURCE_SHA
              || artifact.workflow_run?.head_branch !== 'test'
              || !new RegExp(`^config-authoring-test-${runId}-[1-9][0-9]*-${process.env.SOURCE_SHA}$`).test(artifact.name)) {
              fail('source_artifact_invalid_or_expired');
            }

  rollback:
    if: github.event_name == 'workflow_dispatch' && inputs.recovery_mode == 'GitHub-release'
    runs-on: ubuntu-latest
    needs: verify-source
    environment: test
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Verify current immutable tooling
        shell: bash
        env:
          TOOLING_SHA: ${{ inputs.expected_tooling_sha }}
          WORKFLOW_SHA256: ${{ inputs.expected_workflow_sha256 }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TOOLING_SHA"
          printf '%s  %s\n' "$WORKFLOW_SHA256" .github/workflows/rollback-test.yml | sha256sum --check --strict -
      - name: Download recorded immutable release
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ inputs.source_artifact_id }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: .aws-sam
          merge-multiple: true
      - name: Verify recorded artifact, digest, and source
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          manifest_digest: ${{ inputs.source_manifest_sha256 }}
          EXPECTED_SERVICE: zoolanding-config-authoring
        run: |
          set -euo pipefail
          test -z "$(find .aws-sam -type l -print -quit)"
          printf '%s  %s\n' "$manifest_digest" .aws-sam/build-manifest.sha256 | sha256sum --check --strict -
          (cd .aws-sam/build && sha256sum --check --strict ../build-manifest.sha256)
          python tools/verify_recorded_release.py --build .aws-sam/build --source-sha "$SOURCE_SHA"
      - uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3
        with:
          version: 1.163.0
          use-installer: true
          token: ${{ github.token }}
      - name: Prepare exact TEST parameters without AWS credentials
        shell: bash
        env:
          ARTIFACTS_BUCKET: zoolanding-config-payloads-test
        run: |
          set -euo pipefail
          test -n "$ARTIFACTS_BUCKET" || { echo "sam_artifacts_bucket_required"; exit 1; }
          python3 tools/prepare_test_parameters.py
      - uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Create, describe, review, and execute rollback change set
        shell: bash
        env:
          STACK_NAME: zoolanding-config-authoring-test
          CHANGE_SET_NAME: rollback-${{ github.run_id }}-${{ github.run_attempt }}
          RELEASE_SHA: ${{ inputs.source_sha }}
          ARTIFACTS_BUCKET: zoolanding-config-payloads-test
          PARAMETER_FILE: ${{ runner.temp }}/test-release-parameters/parameters.json
          EXPECTED_PARAMETER_FILE: ${{ runner.temp }}/test-release-parameters/expected-parameters.txt
          REQUIRED_PARAMETER_FILE: ${{ runner.temp }}/test-release-parameters/required-parameters.txt
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          CHANGE_SET_COMMANDS: create-change-set describe-change-set execute-change-set
          STATEFUL_RESOURCE_GUARD: stateful_resource_change_forbidden
          REVIEWER_PATH: tools/review_test_change_set.py
          ARTIFACT_PREFIX_ROOT: system/deploy-artifacts
        run: bash tools/run_test_change_set.sh
      - name: Post-deploy smoke
        shell: bash
        env:
          STACK_NAME: zoolanding-config-authoring-test
        run: bash tools/smoke_test_stack.sh

  recover-aws:
    if: github.event_name == 'workflow_dispatch' && inputs.recovery_mode == 'AWS-live-snapshot/v1'
    runs-on: ubuntu-latest
    needs: verify-source
    environment: test
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Verify current immutable tooling
        shell: bash
        env:
          TOOLING_SHA: ${{ inputs.expected_tooling_sha }}
          WORKFLOW_SHA256: ${{ inputs.expected_workflow_sha256 }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/test"
          test "$(git rev-parse HEAD)" = "$TOOLING_SHA"
          printf '%s  %s\n' "$WORKFLOW_SHA256" .github/workflows/rollback-test.yml | sha256sum --check --strict -
      - name: Install fixed operator-only dependencies
        run: python -m pip install --disable-pip-version-check boto3==1.43.81 botocore==1.43.81 PyYAML==6.0.2
      - uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Execute approved AWS-observed recovery and Post-deploy smoke
        shell: bash
        env:
          CONFIG_TEST_RECOVERY_SELECTION_JSON: ${{ secrets.CONFIG_TEST_RECOVERY_SELECTION_JSON }}
          TOOLING_SHA: ${{ inputs.expected_tooling_sha }}
          WORKFLOW_SHA256: ${{ inputs.expected_workflow_sha256 }}
          SNAPSHOT_SHA256: ${{ inputs.expected_snapshot_sha256 }}
          PLAN_SHA256: ${{ inputs.expected_plan_sha256 }}
        run: |
          set -euo pipefail
          python tools/aws_live_snapshot.py recover \
            --expected-tooling-sha "$TOOLING_SHA" \
            --expected-workflow-sha256 "$WORKFLOW_SHA256" \
            --expected-snapshot-sha256 "$SNAPSHOT_SHA256" \
            --expected-plan-sha256 "$PLAN_SHA256" \
            --change-set-name "recovery-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
