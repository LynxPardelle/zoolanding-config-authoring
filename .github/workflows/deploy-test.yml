name: Deploy Test

on:
  workflow_dispatch:
    inputs:
      execution:
        type: choice
        options: [review, execute]
        default: review
        required: true
      review_digest:
        type: string
        required: false
      review_change_set_arn:
        type: string
        required: false
  push:
    branches: [test]

permissions:
  contents: read

concurrency:
  group: zoolanding-config-authoring-test
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      source_only: ${{ steps.release_mode.outputs.source_only }}
    permissions:
      contents: read
    env:
      BEFORE_SHA: ${{ github.event.before }}
      SOURCE_BRANCH: "dev"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - name: Separate source-only promotion from reviewed activation
        id: release_mode
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTION_SELECTION_JSON: ${{ vars.AUTHORING_TEST_PROMOTION_SELECTION_JSON }}
          ACTIVATION_SELECTION_JSON: ${{ vars.AUTHORING_TEST_ACTIVATION_SELECTION_JSON }}
        run: python tools/verify_source_only_promotion.py --target=test
      - name: Require dev merge
        if: steps.release_mode.outputs.source_only != 'true'
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/${SOURCE_BRANCH}:refs/remotes/origin/${SOURCE_BRANCH}"
          commit="$(git rev-parse HEAD)"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then BEFORE_SHA="$(git rev-parse HEAD^1)"; fi
          source_tip="$(git rev-parse "refs/remotes/origin/${SOURCE_BRANCH}")"
          commit_tree="$(git rev-parse "${commit}^{tree}")"
          source_tree="$(git rev-parse "${source_tip}^{tree}")"
          parents_line="$(git rev-list --parents -n 1 HEAD)"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
          python tools/verify_promotion_provenance.py \
            --commit "$commit" \
            --before-sha "$BEFORE_SHA" \
            --source-tip "$source_tip" \
            --commit-tree "$commit_tree" \
            --source-tree "$source_tree" \
            --parents-line "$parents_line"
          fi

  source_validate:
    runs-on: ubuntu-latest
    needs: guard
    if: needs.guard.outputs.source_only == 'true'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -p "test_*.py"

  validate:
    if: needs.guard.outputs.source_only != 'true'
    runs-on: ubuntu-latest
    needs: guard
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_name: ${{ steps.artifact_metadata.outputs.name }}
      manifest_digest: ${{ steps.manifest.outputs.digest }}
    permissions:
      contents: read
    env:
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
      SAM_CLI_TELEMETRY: 0
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3
        with:
          version: 1.163.0
          use-installer: true
          token: ${{ github.token }}
      - name: Reverify exact dev merge without credentials
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          SOURCE_BRANCH: dev
          GH_TOKEN: ${{ github.token }}
          ACTIVATION_SELECTION_JSON: ${{ vars.AUTHORING_TEST_ACTIVATION_SELECTION_JSON }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/${SOURCE_BRANCH}:refs/remotes/origin/${SOURCE_BRANCH}"
          commit="$(git rev-parse HEAD)"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then BEFORE_SHA="$(git rev-parse HEAD^1)"; fi
          source_tip="$(git rev-parse "refs/remotes/origin/${SOURCE_BRANCH}")"
          commit_tree="$(git rev-parse "${commit}^{tree}")"
          source_tree="$(git rev-parse "${source_tip}^{tree}")"
          parents_line="$(git rev-list --parents -n 1 HEAD)"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            python tools/verify_source_only_promotion.py --target=test
          else
          python tools/verify_promotion_provenance.py \
            --commit "$commit" \
            --before-sha "$BEFORE_SHA" \
            --source-tip "$source_tip" \
            --commit-tree "$commit_tree" \
            --source-tree "$source_tree" \
            --parents-line "$parents_line"
          fi
      - name: Test and build exact artifact without AWS credentials
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p "test_*.py"
          python tools/build_lambda_artifact.py
          sam validate --lint
          sam build --no-cached
          python tools/build_lambda_artifact.py --verify-artifact .aws-sam/build/ConfigAuthoringFunction
          python tools/build_lambda_artifact.py --normalize-artifact .aws-sam/build/ConfigAuthoringFunction
          python tools/build_lambda_artifact.py \
            --write-sam-manifest .aws-sam/build \
            --source-commit "$GITHUB_SHA"
          python tools/build_lambda_artifact.py \
            --verify-sam-build .aws-sam/build \
            --expected-source-commit "$GITHUB_SHA"
      - name: Write exact outer build manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          (cd .aws-sam/build && LC_ALL=C find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) > .aws-sam/build-manifest.sha256
          digest="$(sha256sum .aws-sam/build-manifest.sha256 | cut -d ' ' -f 1)"
          if [[ ! "$digest" =~ ^[a-f0-9]{64}$ ]]; then
            echo "manifest_digest_invalid"
            exit 1
          fi
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Define artifact identity
        id: artifact_metadata
        shell: bash
        env:
          ARTIFACT_NAME: config-authoring-test-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
        run: |
          set -euo pipefail
          printf 'name=%s\n' "$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
      - name: Upload exact validated artifact
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact_metadata.outputs.name }}
          path: |
            .aws-sam/build/
            .aws-sam/build-manifest.sha256
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  deploy:
    runs-on: ubuntu-latest
    needs: validate
    environment: test
    permissions:
      id-token: write
      contents: read
    env:
      EXECUTION: ${{ inputs.execution }}
      REVIEW_DIGEST: ${{ inputs.review_digest }}
      REVIEW_CHANGE_SET_ARN: ${{ inputs.review_change_set_arn }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      SAM_CLI_TELEMETRY: 0
    steps:
      - name: Validate artifact handoff metadata
        shell: bash
        env:
          EXPECTED_ARTIFACT_ID: ${{ needs.validate.outputs.artifact_id }}
          EXPECTED_ARTIFACT_NAME: ${{ needs.validate.outputs.artifact_name }}
          EXPECTED_MANIFEST_DIGEST: ${{ needs.validate.outputs.manifest_digest }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "artifact_id_invalid"
            exit 1
          fi
          artifact_name_pattern="^config-authoring-test-${GITHUB_RUN_ID}-[1-9][0-9]*-${GITHUB_SHA}$"
          if [[ ! "$EXPECTED_ARTIFACT_NAME" =~ $artifact_name_pattern ]]; then
            echo "artifact_name_invalid"
            exit 1
          fi
          if [[ ! "$EXPECTED_MANIFEST_DIGEST" =~ ^[a-f0-9]{64}$ ]]; then
            echo "manifest_digest_invalid"
            exit 1
          fi
      - name: Download validated artifact by immutable ID
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact_id }}
          path: .aws-sam
      - name: Verify and normalize exact validated artifact
        shell: bash
        env:
          EXPECTED_MANIFEST_DIGEST: ${{ needs.validate.outputs.manifest_digest }}
        run: |
          set -euo pipefail
          if [[ -n "$(find .aws-sam -type l -print -quit)" ]]; then
            echo "artifact_link_invalid"
            exit 1
          fi
          test -f .aws-sam/build-manifest.sha256
          printf '%s  %s\n' "$EXPECTED_MANIFEST_DIGEST" '.aws-sam/build-manifest.sha256' \
            | sha256sum --check --strict -
          (cd .aws-sam/build && sha256sum --check --strict ../build-manifest.sha256)
          printf '%s\n' \
            './ConfigAuthoringFunction/lambda_function.py' \
            './ConfigAuthoringFunction/schemas/server-features/commerce.schema.json' \
            './ConfigAuthoringFunction/schemas/server-features/data-spaces.schema.json' \
            './ConfigAuthoringFunction/schemas/server-features/integration-bindings.schema.json' \
            './ConfigAuthoringFunction/schemas/server-features/notification-policies.schema.json' \
            './ConfigAuthoringFunction/schemas/server-features/protected-feature-bindings-v2.schema.json' \
            './ConfigAuthoringFunction/server_policy_validation.py' \
            './ConfigAuthoringFunction/zoolanding_lambda_common.py' \
            './config-authoring-manifest.json' \
            './template.yaml' > "$RUNNER_TEMP/expected-build-files.txt"
          cut -c67- .aws-sam/build-manifest.sha256 | LC_ALL=C sort > "$RUNNER_TEMP/manifest-paths.txt"
          (cd .aws-sam/build && LC_ALL=C find . \( -type f -o -type l \) -print | LC_ALL=C sort) \
            > "$RUNNER_TEMP/artifact-paths.txt"
          diff -u "$RUNNER_TEMP/expected-build-files.txt" "$RUNNER_TEMP/manifest-paths.txt"
          diff -u "$RUNNER_TEMP/expected-build-files.txt" "$RUNNER_TEMP/artifact-paths.txt"
          printf '%s\n' \
            './build-manifest.sha256' \
            './build/ConfigAuthoringFunction/lambda_function.py' \
            './build/ConfigAuthoringFunction/schemas/server-features/commerce.schema.json' \
            './build/ConfigAuthoringFunction/schemas/server-features/data-spaces.schema.json' \
            './build/ConfigAuthoringFunction/schemas/server-features/integration-bindings.schema.json' \
            './build/ConfigAuthoringFunction/schemas/server-features/notification-policies.schema.json' \
            './build/ConfigAuthoringFunction/schemas/server-features/protected-feature-bindings-v2.schema.json' \
            './build/ConfigAuthoringFunction/server_policy_validation.py' \
            './build/ConfigAuthoringFunction/zoolanding_lambda_common.py' \
            './build/config-authoring-manifest.json' \
            './build/template.yaml' > "$RUNNER_TEMP/expected-artifact-files.txt"
          (cd .aws-sam && LC_ALL=C find . \( -type f -o -type l \) -print | LC_ALL=C sort) \
            > "$RUNNER_TEMP/all-artifact-paths.txt"
          diff -u "$RUNNER_TEMP/expected-artifact-files.txt" "$RUNNER_TEMP/all-artifact-paths.txt"
          find .aws-sam/build/ConfigAuthoringFunction -type f -exec touch -t 198001010000.00 {} +
          find .aws-sam/build/ConfigAuthoringFunction -depth -type d -exec touch -t 198001010000.00 {} +
      - uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3
        with:
          version: 1.163.0
          use-installer: true
          token: ${{ github.token }}
      - name: Validate transported SAM template
        run: sam validate --lint --template-file .aws-sam/build/template.yaml
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          EXPECTED_SHA: ${{ github.sha }}
          SOURCE_BRANCH: dev
          GH_TOKEN: ${{ github.token }}
          ACTIVATION_SELECTION_JSON: ${{ vars.AUTHORING_TEST_ACTIVATION_SELECTION_JSON }}
          TARGET_BRANCH: test
          EXECUTION: ${{ inputs.execution }}
          REVIEW_DIGEST: ${{ inputs.review_digest }}
          REVIEW_CHANGE_SET_ARN: ${{ inputs.review_change_set_arn }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fail = code => { throw new Error(code); };
            const isSha = value => /^[a-f0-9]{40}$/.test(value ?? '');
            const repository = process.env.GITHUB_REPOSITORY;
            const sha = process.env.EXPECTED_SHA;
            const sourceBranch = process.env.SOURCE_BRANCH;
            const targetBranch = process.env.TARGET_BRANCH;
            const event = context.payload;
            if (!repository || !isSha(sha) || !['push','workflow_dispatch'].includes(context.eventName)
              || process.env.GITHUB_REF !== `refs/heads/${targetBranch}`
              || (context.eventName === 'push' && (event.forced === true || event.created === true || event.deleted === true
              || event.after !== sha || !isSha(event.before) || /^0+$/.test(event.before)))) {
              fail('promotion_context_invalid');
            }
            const [owner, repo] = repository.split('/');
            if (!owner || !repo) fail('promotion_repository_invalid');
            const { data: commit } = await github.rest.git.getCommit({ owner, repo, commit_sha: sha });
            const parents = Array.isArray(commit.parents) ? commit.parents.map(parent => parent.sha) : [];
            if (parents.length !== 2 || parents.some(parent => !isSha(parent))) {
              fail('promotion_merge_commit_required');
            }
            if (context.eventName === 'push' && parents[0] !== event.before) fail('promotion_first_parent_mismatch');
            const { data: source } = await github.rest.repos.getBranch({ owner, repo, branch: sourceBranch });
            if (!isSha(source.commit?.sha) || parents[1] !== source.commit.sha) {
              fail('promotion_source_tip_mismatch');
            }
            const { data: sourceCommit } = await github.rest.git.getCommit({
              owner,
              repo,
              commit_sha: source.commit.sha,
            });
            if (!isSha(commit.tree?.sha) || (context.eventName !== 'workflow_dispatch' && commit.tree.sha !== sourceCommit.tree?.sha)) {
              fail('promotion_tree_mismatch');
            }
            const { data: target } = await github.rest.repos.getBranch({ owner, repo, branch: targetBranch });
            if (target.commit?.sha !== sha) fail('promotion_target_tip_mismatch');
            core.info('promotion_provenance_verified');
            if (context.eventName === 'workflow_dispatch') {
            const activationFail = () => { throw new Error('activation_selection_rejected'); };
            if (context.eventName !== 'workflow_dispatch' || !['review','execute'].includes(process.env.EXECUTION)
              || (process.env.EXECUTION === 'execute' && !/^[a-f0-9]{64}$/.test(process.env.REVIEW_DIGEST ?? ''))
              || (process.env.EXECUTION === 'review' && (process.env.REVIEW_DIGEST || process.env.REVIEW_CHANGE_SET_ARN))
              || (process.env.EXECUTION === 'execute' && !/^arn:aws:cloudformation:us-east-1:765932874577:changeSet\/zoolanding-[1-9][0-9]*-[1-9][0-9]*\/[a-f0-9-]+$/.test(process.env.REVIEW_CHANGE_SET_ARN ?? ''))) activationFail();
            const selection = JSON.parse(require('node:child_process').execFileSync('python3', ['-c', 'import json,os;from tools.verify_source_only_promotion import parse_selection;print(json.dumps(parse_selection(os.getenv("ACTIVATION_SELECTION_JSON","null"))))'], {encoding:'utf8'}));
            if (!selection || Object.keys(selection).sort().join(',') !== 'mode,schemaVersion,sha,tree,workflowSha256'
              || selection.schemaVersion !== 1 || selection.mode !== 'thn-reviewed-activation'
              || selection.sha !== context.sha || !/^[a-f0-9]{40}$/.test(selection.tree ?? '')
              || !/^[a-f0-9]{64}$/.test(selection.workflowSha256 ?? '')) activationFail();
            const activationRepository = context.repo;
            const {data:activationCommit} = await github.rest.git.getCommit({...activationRepository,commit_sha:context.sha});
            const {data:workflow} = await github.rest.repos.getContent({...activationRepository,path:'.github/workflows/deploy-test.yml',ref:context.sha});
            if (activationCommit.tree.sha !== selection.tree || workflow.encoding !== 'base64' || typeof workflow.content !== 'string') activationFail();
            const digest = require('node:crypto').createHash('sha256').update(Buffer.from(workflow.content,'base64').toString('utf8').replace(/\r\n/g,'\n')).digest('hex');
            if (digest !== selection.workflowSha256) activationFail();
            }
      - uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Create, review, and execute an exact nonreplacement change set
        env:
          STACK_NAME: zoolanding-config-authoring-test
          CHANGE_SET_NAME: "zoolanding-${{ github.run_id }}-${{ github.run_attempt }}"
          EXPECTED_ENVIRONMENT: test
          EXPECTED_MANAGE_STORAGE: "true"
          EXPECTED_TABLE: zoolanding-config-registry-test
          EXPECTED_BUCKET: zoolanding-config-payloads-test
        run: |
          set -euo pipefail
          packaged="$RUNNER_TEMP/packaged-template.json"
          description="$RUNNER_TEMP/reviewed-change-set.json"
          collect_native_baseline() {
            python3 - "$STACK_NAME" "$1" <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          def aws(*args):
              result=subprocess.run(["aws",*args,"--output","json","--no-cli-pager"],capture_output=True,text=True)
              if result.returncode: raise SystemExit("native_baseline_unavailable")
              return json.loads(result.stdout)
          if os.getenv("AWS_REGION") != "us-east-1" or aws("sts","get-caller-identity").get("Account") != "765932874577":
              raise SystemExit("native_identity_invalid")
          stack=aws("cloudformation","describe-stacks","--stack-name",sys.argv[1])["Stacks"]
          if len(stack)!=1 or stack[0].get("StackStatus") not in ("CREATE_COMPLETE","UPDATE_COMPLETE"):
              raise SystemExit("native_stack_unavailable")
          resources=aws("cloudformation","list-stack-resources","--stack-name",sys.argv[1])["StackResourceSummaries"]
          identities=sorted([{key:item.get(key) for key in ("LogicalResourceId","PhysicalResourceId","ResourceType")} for item in resources],key=lambda item:item["LogicalResourceId"])
          functions=[aws("lambda","get-function-configuration","--function-name",item["PhysicalResourceId"]) for item in identities if item["ResourceType"]=="AWS::Lambda::Function"]
          baseline={"stackId":stack[0]["StackId"],"parameters":sorted(stack[0].get("Parameters",[]),key=lambda item:item["ParameterKey"]),
            "outputs":sorted(stack[0].get("Outputs",[]),key=lambda item:item["OutputKey"]),"identities":identities,"functions":functions,
            "original":aws("cloudformation","get-template","--stack-name",sys.argv[1],"--template-stage","Original")["TemplateBody"],
            "processed":aws("cloudformation","get-template","--stack-name",sys.argv[1],"--template-stage","Processed")["TemplateBody"]}
          Path(sys.argv[2]).write_text(json.dumps(baseline,sort_keys=True,separators=(",",":")),encoding="utf-8")
          PY
          }
          baseline="$RUNNER_TEMP/native-review-baseline.json"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then collect_native_baseline "$baseline"; fi
          if [[ "$EXECUTION" == "execute" ]]; then
            change_set_arn="$REVIEW_CHANGE_SET_ARN"
            CHANGE_SET_NAME="${change_set_arn#*:changeSet/}"
            CHANGE_SET_NAME="${CHANGE_SET_NAME%%/*}"
          else
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            bucket_versioning="$(aws s3api get-bucket-versioning --bucket "$EXPECTED_BUCKET" --expected-bucket-owner 765932874577 --query Status --output text --no-cli-pager)"
            test "$bucket_versioning" = Enabled
          fi
          sam package \
            --template-file .aws-sam/build/template.yaml \
            --s3-bucket "$EXPECTED_BUCKET" \
            --s3-prefix "system/deploy-artifacts/${GITHUB_SHA}/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}" \
            --output-template-file "$packaged" \
            --use-json \
            --region "$AWS_REGION"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
          python3 - "$packaged" "$EXPECTED_BUCKET" <<'PY'
          import json, subprocess, sys, os, re
          from pathlib import Path
          from urllib.parse import urlsplit
          path=Path(sys.argv[1]); template=json.loads(path.read_text())
          code=template["Resources"]["ConfigAuthoringFunction"]["Properties"]["CodeUri"]
          if isinstance(code,str):
              parsed=urlsplit(code)
              if parsed.scheme!="s3" or parsed.query or parsed.fragment or "%" in parsed.path or not parsed.path.startswith("/"):
                  raise SystemExit("test_code_coordinates_invalid")
              code={"Bucket":parsed.netloc,"Key":parsed.path[1:]}
          prefix="system/deploy-artifacts/"+os.environ["GITHUB_SHA"]+"/"+os.environ["GITHUB_RUN_ID"]+"/"+os.environ["GITHUB_RUN_ATTEMPT"]
          if not isinstance(code,dict) or set(code)!={"Bucket","Key"} or code["Bucket"]!=sys.argv[2] or not re.fullmatch(re.escape(prefix)+r"/[A-Za-z0-9._-]{16,128}",str(code.get("Key",""))):
              raise SystemExit("test_code_coordinates_invalid")
          head=subprocess.run(["aws","s3api","head-object","--bucket",code["Bucket"],"--key",code["Key"],"--output","json","--no-cli-pager"],capture_output=True,text=True)
          if head.returncode: raise SystemExit("test_code_version_unavailable")
          version=json.loads(head.stdout).get("VersionId")
          if not isinstance(version,str) or not version or version=="null": raise SystemExit("test_code_version_unavailable")
          code["Version"]=version
          template["Resources"]["ConfigAuthoringFunction"]["Properties"]["CodeUri"]=code
          path.write_text(json.dumps(template,sort_keys=True,separators=(",",":")),encoding="utf-8")
          PY
          fi
          change_set_arn="$(aws cloudformation create-change-set \
            --stack-name "$STACK_NAME" \
            --change-set-name "$CHANGE_SET_NAME" \
            --change-set-type UPDATE \
            --client-token "github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}" \
            --description "GitHub ${GITHUB_REPOSITORY}@${GITHUB_SHA}" \
            --template-body "file://$packaged" \
            --capabilities CAPABILITY_IAM \
            --parameters \
              "ParameterKey=EnvironmentName,ParameterValue=$EXPECTED_ENVIRONMENT" \
              "ParameterKey=ManageStorageResources,ParameterValue=$EXPECTED_MANAGE_STORAGE" \
              "ParameterKey=ConfigTableName,ParameterValue=$EXPECTED_TABLE" \
              "ParameterKey=ConfigPayloadsBucketName,ParameterValue=$EXPECTED_BUCKET" \
              "ParameterKey=LogLevel,ParameterValue=INFO" \
              "ParameterKey=DeployAuthzConfigS3Key,ParameterValue=system/deploy-authz-v2.json" \
            --query 'Id' \
            --output text \
            --no-cli-pager)"
          fi
          set +e
          aws cloudformation wait change-set-create-complete \
            --stack-name "$STACK_NAME" \
            --change-set-name "$change_set_arn"
          wait_status=$?
          set -e
          aws cloudformation describe-change-set \
            --stack-name "$STACK_NAME" \
            --change-set-name "$change_set_arn" \
            --include-property-values \
            --output json \
            --no-cli-pager > "$description"
          expected_parameters="{\"EnvironmentName\":\"${EXPECTED_ENVIRONMENT}\",\"ManageStorageResources\":\"${EXPECTED_MANAGE_STORAGE}\",\"ConfigTableName\":\"${EXPECTED_TABLE}\",\"ConfigPayloadsBucketName\":\"${EXPECTED_BUCKET}\",\"LogLevel\":\"INFO\",\"DeployAuthzConfigS3Key\":\"system/deploy-authz-v2.json\"}"
          decision="$(python3 - "$description" "$STACK_NAME" "$CHANGE_SET_NAME" "$change_set_arn" "$expected_parameters" <<'PY'
          # inline-change-set-review:start
          import json
          from pathlib import Path
          import re
          import sys

          NO_CHANGE_REASON = (
              "The submitted information didn't contain changes. "
              "Submit different information to create a change set."
          )


          def fail(code):
              raise SystemExit(code)


          if len(sys.argv) != 6:
              fail("change_set_review_arguments_invalid")
          description, expected_stack, expected_name, expected_arn, parameter_json = sys.argv[1:]
          try:
              payload = json.loads(Path(description).read_text(encoding="utf-8"))
              expected_parameters = json.loads(parameter_json)
          except (OSError, UnicodeDecodeError, json.JSONDecodeError):
              fail("change_set_description_invalid")
          if not isinstance(payload, dict) or not isinstance(expected_parameters, dict) or not expected_parameters:
              fail("change_set_description_invalid")
          if not all(isinstance(key, str) and isinstance(value, str) for key, value in expected_parameters.items()):
              fail("change_set_expected_parameters_invalid")
          arn_pattern = (
              r"^arn:(?:aws|aws-us-gov|aws-cn):cloudformation:[a-z0-9-]+:[0-9]{12}:"
              + r"changeSet/" + re.escape(expected_name) + r"/[A-Za-z0-9-]+$"
          )
          if re.fullmatch(arn_pattern, expected_arn) is None:
              fail("change_set_arn_invalid")
          parameters = payload.get("Parameters")
          if not isinstance(parameters, list):
              fail("change_set_parameters_invalid")
          actual_parameters = {}
          for entry in parameters:
              if not isinstance(entry, dict):
                  fail("change_set_parameters_invalid")
              key = entry.get("ParameterKey")
              value = entry.get("ParameterValue")
              if not isinstance(key, str) or not isinstance(value, str) or key in actual_parameters:
                  fail("change_set_parameters_invalid")
              actual_parameters[key] = value
          invalid_type = "ChangeSetType" in payload and payload.get("ChangeSetType") != "UPDATE"
          if (
              payload.get("StackName") != expected_stack
              or payload.get("ChangeSetName") != expected_name
              or payload.get("ChangeSetId") != expected_arn
              or invalid_type
              or actual_parameters != expected_parameters
          ):
              fail("change_set_identity_invalid")
          status = payload.get("Status")
          execution_status = payload.get("ExecutionStatus")
          changes = payload.get("Changes")
          if (
              status == "FAILED"
              and execution_status == "UNAVAILABLE"
              and payload.get("StatusReason") == NO_CHANGE_REASON
              and changes in (None, [])
          ):
              print("noop")
              raise SystemExit(0)
          if status != "CREATE_COMPLETE" or execution_status != "AVAILABLE":
              fail("change_set_not_available")
          if not isinstance(changes, list) or not changes:
              fail("change_set_changes_invalid")
          for change in changes:
              if not isinstance(change, dict) or change.get("Type") != "Resource":
                  fail("change_set_entry_invalid")
              resource = change.get("ResourceChange")
              if not isinstance(resource, dict) or resource.get("Action") not in {"Add", "Modify"}:
                  fail("change_set_resource_invalid")
              if resource.get("Replacement") not in (None, "False"):
                  fail("change_set_replacement_invalid")
          print("execute")
          # inline-change-set-review:end
          PY
          )"
          if [[ "$decision" == "noop" ]]; then
            aws cloudformation delete-change-set \
              --stack-name "$STACK_NAME" \
              --change-set-name "$change_set_arn" \
              --no-cli-pager
            echo "No CloudFormation changes to execute."
            exit 0
          fi
          test "$decision" = "execute"
          test "$wait_status" -eq 0
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
          aws cloudformation get-template --stack-name "$STACK_NAME" --change-set-name "$change_set_arn" --template-stage Original --output json --no-cli-pager > "$RUNNER_TEMP/review-original.json"
          aws cloudformation get-template --stack-name "$STACK_NAME" --change-set-name "$change_set_arn" --template-stage Processed --output json --no-cli-pager > "$RUNNER_TEMP/review-processed.json"
          review_inventory_digest="$(python3 - "$description" "$RUNNER_TEMP/review-original.json" .aws-sam/build-manifest.sha256 "$baseline" "$GITHUB_SHA" "$RUNNER_TEMP/review-processed.json" <<'PY'
          # inline-review-digest:start
          import hashlib, json, sys
          from pathlib import Path
          change_set=json.loads(Path(sys.argv[1]).read_text())
          inventory={"changeSetId":change_set.get("ChangeSetId"),"stackId":change_set.get("StackId"),"sourceSha":sys.argv[5],"originalSha256":hashlib.sha256(Path(sys.argv[2]).read_bytes()).hexdigest(),
            "sealedManifestSha256":hashlib.sha256(Path(sys.argv[3]).read_bytes()).hexdigest(),
            "nativeBaselineSha256":hashlib.sha256(Path(sys.argv[4]).read_bytes()).hexdigest(),
            "processedSha256":hashlib.sha256(Path(sys.argv[6]).read_bytes()).hexdigest(),
            "parameters":sorted(change_set.get("Parameters",[]),key=lambda item:item.get("ParameterKey","")),
            "changes":sorted(change_set["Changes"],key=lambda item:item["ResourceChange"]["LogicalResourceId"])}
          print(hashlib.sha256(json.dumps(inventory,sort_keys=True,separators=(",",":"),ensure_ascii=True).encode()).hexdigest())
          # inline-review-digest:end
          PY
          )"
          printf 'review_inventory_digest=%s\n' "$review_inventory_digest" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$EXECUTION" == "review" ]]; then
            printf 'review_change_set_arn=%s\n' "$change_set_arn" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          test "$EXECUTION" = "execute"
          test "$REVIEW_DIGEST" = "$review_inventory_digest"
          collect_native_baseline "$RUNNER_TEMP/native-execute-baseline.json"
          cmp -s "$baseline" "$RUNNER_TEMP/native-execute-baseline.json"
          fi
          aws cloudformation execute-change-set \
            --stack-name "$STACK_NAME" \
            --change-set-name "$change_set_arn" \
            --client-request-token "execute-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}" \
            --no-cli-pager
          aws cloudformation wait stack-update-complete --stack-name "$STACK_NAME"
          final_status="$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query 'Stacks[0].StackStatus' \
            --output text \
            --no-cli-pager)"
          test "$final_status" = "UPDATE_COMPLETE"
      - name: Post-deploy smoke
        if: github.event_name == 'push' || inputs.execution == 'execute'
        shell: bash
        env:
          STACK_NAME: zoolanding-config-authoring-test
        run: |
          set -euo pipefail
          status="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query 'Stacks[0].StackStatus' --output text --no-cli-pager)"
          case "$status" in
            CREATE_COMPLETE|UPDATE_COMPLETE) ;;
            *) echo "stack_status_invalid"; exit 1 ;;
          esac
          mapfile -t functions < <(aws cloudformation list-stack-resources --stack-name "$STACK_NAME" --query "StackResourceSummaries[?ResourceType=='AWS::Lambda::Function'].PhysicalResourceId" --output text --no-cli-pager | tr '\t' '\n' | sed '/^$/d')
          test "${#functions[@]}" -gt 0
          for function_name in "${functions[@]}"; do
            read -r state update_status < <(aws lambda get-function-configuration --function-name "$function_name" --query '[State,LastUpdateStatus]' --output text --no-cli-pager)
            test "$state" = "Active"
            test "$update_status" = "Successful"
          done
      - name: Record immutable release coordinates
        if: github.event_name == 'push' || inputs.execution == 'execute'
        shell: bash
        env:
          ARTIFACT_ID: ${{ needs.validate.outputs.artifact_id }}
          MANIFEST_DIGEST: ${{ needs.validate.outputs.manifest_digest }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          {
            echo "### TEST release"
            echo "- source_run_id: $GITHUB_RUN_ID"
            echo "- source_artifact_id: $ARTIFACT_ID"
            echo "- source_sha: $RELEASE_SHA"
            echo "- source_manifest_sha256: $MANIFEST_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
